services:
  face-worker:
    build:
      context: ./services/face-worker
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
    depends_on:
      - face-worker
    environment:
      DATABASE_URL: postgresql://postgres:123456@student_db:5432/student_manager?schema=public
      FRONTEND_ORIGIN: http://localhost:3000
      FACE_ID_ENABLED: "true"
      FACE_ID_THRESHOLD: "0.75"
      FACE_WORKER_URL: http://face-worker:8000
      FACE_ID_MAX_UPLOAD_SIZE_MB: "5"
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    ports:
      - "3001:3001"
